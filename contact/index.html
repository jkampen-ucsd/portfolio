<!DOCTYPE html>
<html lang="en">
<head>

    <title>Contact</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
</head>
<body>

    <h1>Contact Me</h1>

    <form action="mailto:jkampen@ucsd.edu">

            Subject:

        <label>
            Message:

    </form>
